apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-web
  namespace: analytics-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      containers:
      - name: web-container
        image: app-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000