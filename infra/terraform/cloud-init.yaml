#cloud-config
package_update: true
packages:
  - docker.io
  - git
  - curl

runcmd:
  - systemctl start docker
  - systemctl enable docker
  - sleep 10
  - mkdir -p /usr/local/lib/docker/cli-plugins
  - curl -SL https://github.com/docker/compose/releases/download/v2.20.2/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
  - chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
  - ln -s /usr/local/lib/docker/cli-plugins/docker-compose /usr/local/bin/docker-compose
  - mkdir -p /home/azureuser/app
  - chown azureuser:azureuser /home/azureuser/app
  - git clone https://github.com/Ania-Savchuk/open-data-ai-analytics-docker.git /home/azureuser/app
  - cd /home/azureuser/app && /usr/local/bin/docker-compose -f compose.yaml up -d
  - cd /home/azureuser/app && /usr/local/bin/docker-compose -f monitoring/docker-compose.monitoring.yml up -d