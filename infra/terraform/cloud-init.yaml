#cloud-config
package_update: true
packages:
  - git
  - curl

runcmd:
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker azureuser || true

  - mkdir -p /home/azureuser/app
  - chown azureuser:azureuser /home/azureuser/app
  - git clone https://github.com/Ania-Savchuk/open-data-ai-analytics-docker.git /home/azureuser/app || true

  - cd /home/azureuser/app && docker-compose -f compose.yaml up -d
  - cd /home/azureuser/app && docker-compose -f monitoring/docker-compose.monitoring.yml up -d

final_message: "The system is finally up, after all the debugging!"