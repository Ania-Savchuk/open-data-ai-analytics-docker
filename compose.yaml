services:
  db:
    image: postgres:15
    container_name: analytics_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - analytics_network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  data_load:
    build:
      context: .
      dockerfile: data_load/Dockerfile
      network: host
    container_name: data_load_service
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - analytics_network
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./plots:/app/plots

  data_quality:
    build:
      context: .
      dockerfile: data_quality_analysis/Dockerfile
      network: host
    container_name: data_quality_service
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      data_load:
        condition: service_completed_successfully
    volumes:
      - ./reports:/app/reports
    networks:
      - analytics_network

  data_research:
    build:
      context: .
      dockerfile: data_research/Dockerfile
      network: host
    container_name: data_research_service
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      data_load:
        condition: service_completed_successfully
    volumes:
      - ./plots:/app/plots
      - ./reports:/app/reports
    networks:
      - analytics_network

networks:
  analytics_network:
    driver: bridge

volumes:
  postgres_data: